name: singotune
description: "Singo Tune"
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  dio: ^5.7.0
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0B14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
